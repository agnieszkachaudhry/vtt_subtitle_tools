[project]
name = "vtt-subtitle-tools"
version = "0.1.0"
description = "Parses and serializes WebVTT subtitle files while preserving cues and non-cue blocks verbatim"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
